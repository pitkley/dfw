[package]
name = "dfw"
version = "1.4.0-rc.1"
edition = "2024"
rust-version = "1.88"
authors = ["Pit Kleyersburg <pitkley@googlemail.com>"]
license = "MIT/Apache-2.0"
description = "Docker firewall framework, in Rust"
homepage = "https://github.com/pitkley/dfw"
repository = "https://github.com/pitkley/dfw.git"
readme = "README.md"

categories = ["command-line-interface", "command-line-utilities"]
keywords = ["cli", "docker", "firewall"]

include = [
    "**/*.rs",
    "resources/**/*",
    "Cargo.toml",
    "LICENSE-*",
]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
anyhow = "1"
bollard = "0.21"
clap = { version = "4.6", features = ["cargo", "derive"] }
crossbeam-channel = "^0.5"
derive_builder = "0.20"
futures = "^0.3"
glob = "^0.3"
libc = "^0.2"
serde = { version = "^1", features = ["derive"] }
signal-hook = "0.4"
slog = { version = "^2", features = ["max_level_trace"] }
sloggers = "^2.1"
strum = { version = "0.28", features = ["derive"] }
tempfile = "^3.9"
time = { version = "^0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "1"
thiserror = "2"
url = "^2.5"

[dev-dependencies]
itertools = "0.15"
regex = "^1"
pastey = "0.2"

[[bin]]
name = "dfw"
path = "src/bin/dfw.rs"
doc = false

[features]
docker-tests = []

[profile.release]
lto = true
codegen-units = 1
incremental = false

