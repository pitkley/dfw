name: CI

on:
  push:
    branches:
    - main
    - staging
    - trying
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  check-license-headers:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Check license headers
      run: |
        ./hack/check-license-headers.sh

  rustfmt:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal --no-self-update --component rustfmt
        rustup default stable

    - name: cargo fmt
      run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal --no-self-update --component clippy
        rustup default stable

    - name: cargo clippy
      run: cargo clippy --locked --workspace --all-targets --features docker-tests -- -D warnings

  yamllint:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: yamllint
      run: |
        python3 -m venv "$RUNNER_TEMP/yamllint"
        "$RUNNER_TEMP/yamllint/bin/pip" install yamllint
        "$RUNNER_TEMP/yamllint/bin/yamllint" .

  build-and-test:
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.continue-on-error }}

    strategy:
      fail-fast: false
      matrix:
        rust:
        - stable
        - beta
        - # MSRV
          1.67.0
        target:
        - ""
        continue-on-error:
        - false

        include:
        - rust: stable
          target: "x86_64-unknown-linux-musl"
          continue-on-error: false
        - rust: nightly
          target: ""
          continue-on-error: true

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: |
        rustup toolchain install ${{ matrix.rust }} --profile minimal --no-self-update
        rustup default ${{ matrix.rust }}
        if [ -n "${{ matrix.target }}" ]; then
          rustup target add ${{ matrix.target }}
        fi

    - name: cargo build
      run: cargo build --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
    - name: cargo test
      run: cargo test --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -- --nocapture
