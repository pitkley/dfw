name: GitHub Pages

on:
  push:
    branches:
    - main
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'
    - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

concurrency:
  group: docs-pages
  queue: max

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Checkout
      if: github.event_name == 'push'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Checkout documentation archive
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: gh-pages
        path: gh-pages

    - name: Install Rust toolchain
      if: github.event_name == 'push'
      run: rustup toolchain install stable --profile minimal --no-self-update

    - name: Build docs
      if: github.event_name == 'push'
      run: cargo +stable doc --locked --no-deps

    - name: Update documentation archive
      if: github.event_name == 'push'
      run: |
        [[ "$GITHUB_REF_NAME" == main || "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
        rm -rf "gh-pages/$GITHUB_REF_NAME"
        mv target/doc "gh-pages/$GITHUB_REF_NAME"
        if [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          ln -sfn "$GITHUB_REF_NAME" gh-pages/latest
        fi
        (
          cd gh-pages
          COMMIT_MESSAGE="Deploy documentation for $GITHUB_REF_NAME to GitHub Pages" ../hack/deploy-github-pages.sh
        )

    - name: Prepare Pages artifact
      if: github.ref == 'refs/heads/main'
      run: rsync -aL --exclude=.git gh-pages/ pages/

    - name: Upload Pages artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: pages

  dispatch-deploy:
    # Pages can serve a stale artifact when a tag and main share a commit.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: docs
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
    - name: Dispatch Pages deployment on main
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run gh-pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy documentation
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
