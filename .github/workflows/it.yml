name: Integration tests

on:
  push:
    branches:
    - main
    - staging
    - trying
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  build-test-binary:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal --no-self-update
        rustup default stable
        rustup target add x86_64-unknown-linux-musl
    - name: Build the test-binary
      shell: bash
      run: |
        test_binary=$(
          cargo test --locked \
            --features docker-tests \
            --test dfw \
            --no-run \
            --message-format=json \
            --target x86_64-unknown-linux-musl \
          | jq -r 'select(.reason == "compiler-artifact" and .target.name == "dfw" and .profile.test and .executable) | .executable'
        )
        cp "$test_binary" dfw-docker-test
    - name: Store the test-binary as an artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: dfw-docker-test
        path: dfw-docker-test

  test-on-docker:
    needs:
    - build-test-binary
    strategy:
      fail-fast: false
      matrix:
        dind-image:
        - docker:20.10.24-dind # Debian 12 (oldstable)
        - docker:26.1.4-dind # Debian 13 engine series
        - docker:29.1.3-dind # Ubuntu 24.04 LTS updates
        - docker:29-dind # Current 29.x, including the Fedora 44 engine series
    runs-on: ubuntu-24.04

    services:
      dind:
        image: ${{ matrix.dind-image }}
        ports:
        - 2375/tcp
        env:
          DOCKER_TLS_CERTDIR: ""
        options: --privileged

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Retrieve the test-binary
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: dfw-docker-test
    - name: Run the test binary
      env:
        RUST_TEST_THREADS: 1
        DOCKER_HOST: tcp://127.0.0.1:${{ job.services.dind.ports['2375'] }}
      run: |
        docker compose version
        timeout 60 bash -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
        chmod +x ./dfw-docker-test
        ./dfw-docker-test --nocapture
